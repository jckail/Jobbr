[project]
name = "jobbr"
version = "2.0.0"
description = "Job intelligence: paste a posting, get structured data, a resume fit score, and a pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "httpcore>=1.0.9,<2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openai-agents>=0.6,<1",
  "alembic>=1.13",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=50.0.2,<51",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "ARG", "TRY", "PERF", "S"]
ignore = ["PLR2004", "TRY003", "PLR0913", "PLR0917", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "ARG"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbr*", "migrations*"]

[tool.setuptools.package-data]
migrations = ["script.py.mako"]
